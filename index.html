<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blacklist Checker</title>

<!-- BOOTSTRAP 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
    body {
        background: url("https://images.unsplash.com/photo-1619974317745-370710dbfaac?q=80&w=1331&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D") no-repeat center center fixed;
        background-size: cover;
        backdrop-filter: blur(3px);
    }

    .checker-box {
        margin-top: 120px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 15px;
        box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }

    .loading-text {
        display: none;
        margin-top: 10px;
        font-size: 14px;
        color: #333;
    }

    .modal-header.blacklisted {
        background-color: #d9534f;
        color: white;
    }

    .modal-header.clear {
        background-color: #5cb85c;
        color: white;
    }
</style>

</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-8 checker-box text-center">
            <h3 class="mb-3">🔍 Blacklist Checker</h3>
            <p class="text-muted">Masukkan nama untuk memeriksa apakah terdaftar dalam blacklist.</p>

            <input type="text" id="nama" class="form-control form-control-lg" placeholder="Masukkan nama..." autocomplete="off">

            <button class="btn btn-primary btn-lg w-100 mt-3" onclick="checkName()">Cek Sekarang</button> 

            <p id="loading" class="loading-text">Memeriksa...</p>
        </div>
    </div>
</div>

    <div class="justify-content-center mt-4 d-none" id="resultTable">
      <div class="card shadow-lg" style="width: 900px;">
        <div class="card-header bg-danger text-white text-center fw-bold">
          <i class="bi bi-shield-exclamation me-2"></i>
          Hasil Pemeriksaan Blacklist
        </div>

        <div class="card-body p-0">
          <table class="table table-bordered table-striped align-middle mb-0">
            <thead class="table-secondary text-center">
              <tr>
                <th><i class="bi bi-person-fill me-1"></i> Nama</th>
                <th><i class="bi bi-file-text-fill me-1"></i> Penjelasan</th>
                <th><i class="bi bi-flag-fill me-1"></i> COU</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>



<!-- MODAL RESULT -->
<div class="modal fade" id="resultModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div id="modalHeader" class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="modalMsg"></p>
        <hr>
        <p><b>Penjelasan:</b></p>
        <p id="modalExplanation" class="text-danger fw-bold"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
      </div>

    </div>
  </div>
</div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// GANTI DENGAN API ANDA
const API_URL = "https://script.google.com/macros/s/AKfycbyd6Ty0wojz8gtjKTpl1aExUX3vCd1IB37nc5X2Axg2gCrHqwLxadOTaRPWjwrTLBAr/exec";




function checkName() {
    const nama = document.getElementById("nama").value.trim();
    const loading = document.getElementById("loading");
    const tableWrapper = document.getElementById("resultTable");
    const tbody = document.getElementById("tableBody");

    // RESET STATE
    tableWrapper.classList.add("d-none");
    tableWrapper.classList.remove("d-flex");
    tbody.innerHTML = "";

    if (!nama) {
        showModal("Error", "Nama tidak boleh kosong.", "", "blacklisted");
        return;
    }

    loading.style.display = "block";

    fetch(API_URL + "?name=" + encodeURIComponent(nama))
        .then(res => res.json())
        .then(data => {
            loading.style.display = "none";

            // ✅ DATA BARU DIPAKAI DI SINI
            if (data.status === "found" && data.data.length > 0) {
                tableWrapper.classList.remove("d-none");
                tableWrapper.classList.add("d-flex");

                data.data.forEach(row => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${row.nama}</td>
                            <td>${row.penjelasan || "-"}</td>
                            <td class="text-center">${row.cou || "-"}</td>
                        </tr>
                    `;
                });
            } else {
                showModal(
                    "✔ AMAN",
                    `Tidak ditemukan nama yang diawali <b>${nama}</b>.`,
                    "Tidak ada catatan.",
                    "clear"
                );
            }
        })
        .catch(() => {
            loading.style.display = "none";
            showModal("Error", "Terjadi kesalahan koneksi.", "", "blacklisted");
        });
}
</script>




</body>
</html>
